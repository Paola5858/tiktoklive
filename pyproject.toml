[project]
name = "tiktoklive-engine"
version = "0.1.0"
description = "Event engine que transforma eventos de uma live do TikTok em eventos interativos no Roblox."
requires-python = ">=3.10"
dependencies = [
    "TikTokLive==7.0.1",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "obsws-python>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/tests"]
